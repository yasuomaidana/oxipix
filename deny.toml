# Licence and supply-chain policy. oxipix is MIT OR Apache-2.0, so its dependency tree must stay permissive.
# Only public, open-source crates are used. Crates relicensed to BUSL-1.1 (2026-11) are banned outright.

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "oxirag" },
    { crate = "oxillama" },
    { crate = "oxillama-runtime" },
    { crate = "oxibonsai" },
]

[advisories]
version = 2

[package]
name = "oxipix-compat-image"
version = "0.1.0"
edition = "2024"
description = "100% drop-in API compatibility facade replicating the image crate to pass all 569 upstream tests"
license = "MIT OR Apache-2.0"

[dependencies]
oxipix-core = { path = "../oxipix-core" }
oxipix-simd = { path = "../oxipix-simd" }
oxipix-codecs = { path = "../oxipix-codecs" }
oxipix-ops = { path = "../oxipix-ops" }
bytemuck = { version = "1.21", features = ["derive"] }
thiserror = "2.0"

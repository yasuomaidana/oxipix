[package]
name = "oxipix-gpu"
version = "0.1.0"
edition = "2024"
description = "WGPU compute shaders and Apple Silicon unified memory hardware accelerator for oxipix"
license = "MIT OR Apache-2.0"

[dependencies]
oxipix-core = { path = "../oxipix-core" }
bytemuck = "1.21"
wgpu = { version = "30.0", optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster"]

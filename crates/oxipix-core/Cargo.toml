[package]
name = "oxipix-core"
version = "0.1.0"
edition = "2024"
description = "Core 64-byte aligned SIMD memory, typestate FrameBuffer, and zero-allocation SubPixView for oxipix"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"], optional = true }

[features]
default = ["zeroize"]
zeroize = ["dep:zeroize"]

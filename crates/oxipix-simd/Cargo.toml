[package]
name = "oxipix-simd"
version = "0.1.0"
edition = "2024"
description = "Multi-tier SIMD dispatch, ARM NEON, AVX2, and fast integer AAN DCT for oxipix"
license = "MIT OR Apache-2.0"

[dependencies]
oxipix-core = { path = "../oxipix-core" }
oximedia-simd = { version = "0.2.1", optional = true }

[features]
default = []
oximedia = ["dep:oximedia-simd"]

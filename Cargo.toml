[workspace]
members = [
    "crates/oxipix-core",
    "crates/oxipix-simd",
    "crates/oxipix-codecs",
    "crates/oxipix-ops",
    "crates/oxipix-gpu",
    "crates/oxipix-compat-image",
    "crates/oxipix-barcode",
]
resolver = "2"

[package]
name = "oxipix"
version = "0.1.0"
edition = "2024"
description = "Sovereign zero-copy accelerated pixmaps, multi-tier SIMD/GPU, and patent-clean image codecs"
license = "MIT OR Apache-2.0"

[dependencies]
oxipix-core = { path = "crates/oxipix-core" }
oxipix-simd = { path = "crates/oxipix-simd" }
oxipix-codecs = { path = "crates/oxipix-codecs" }
oxipix-ops = { path = "crates/oxipix-ops" }
oxipix-gpu = { path = "crates/oxipix-gpu" }
oxipix-compat-image = { path = "crates/oxipix-compat-image" }
oxipix-barcode = { path = "crates/oxipix-barcode" }

[features]
default = ["simd", "codecs", "ops", "compat-image", "barcode", "gpu"]
simd = []
codecs = []
ops = []
gpu = ["oxipix-gpu/wgpu"]
compat-image = []
barcode = []

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0"
testcontainers = "0.28.0"
tokio = { version = "1.43", features = ["full"] }

[[bench]]
name = "crate_comparison"
harness = false

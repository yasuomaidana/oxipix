[package]
name = "oxipix"
version = "0.2.0"
edition = "2024"
description = "Document-capture toolkit on top of `image`: optional wgpu acceleration, perspective unwarping, mosaic stitching and raster-to-vector tracing"
license = "MIT OR Apache-2.0"

[dependencies]
image = { version = "0.25", default-features = false }
thiserror = "2.0.21"
oximedia-cv = { version = "0.2.1", optional = true }
bytemuck = { version = "1.25.2", optional = true }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }

[features]
default = ["mosaic", "vectorize"]
# wgpu compute acceleration (opt-in; every operation has a CPU fallback)
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# 2D registration, strip overlap detection, perspective unwarp and stitching
mosaic = ["dep:oximedia-cv"]
# Otsu + Moore-neighbour contour tracing + RDP simplification + SVG synthesis
vectorize = []

[dev-dependencies]
criterion = "0.8.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }

[[bench]]
name = "gpu_vs_cpu"
harness = false
required-features = ["gpu"]
